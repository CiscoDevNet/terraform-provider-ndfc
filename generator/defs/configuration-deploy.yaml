---
resource:
  name: configuration_deploy
  rest_endpoint: /lan-fabric/rest/control/fabrics/%s/inventory/switchesByFabric
  doc_category: Fabric
  generate_tf_resource: true
  skip_codec: true
  description: >-
    This resource allows configuration deployment operations across specified
    switches or all switches in an NDFC-managed fabric.
  attributes:
    - &id
      model_name: id
      tf_name: id
      description: The Terraform Unique Identifier for the Inventory Devices
          resource.
      type: String
      id: true
      use_state: true
      computed: true
      ndfc_type: string

    - &fabric_name
      model_name: fabricName
      tf_name: fabric_name
      reference: true
      description: The name of the fabric
      type: String
      example: CML
      mandatory: true
      tf_requires_replace: true
      ndfc_type: string

    - &serial_numbers
      model_name: serialNumbers
      tf_name: serial_numbers
      description: Value 'ALL' if all switches in the fabric are to be deployed,
          or a list of serial numbers of the switches to be deployed.
      type: List:String
      example: "[\"ALL\"]"
      ndfc_type: set

    - &recalculate
      model_name: recalculate
      tf_name: recalculate
      type: Bool
      description: Perform recalculate operation when true; also known as config-save in API.
      default_value: false
      ndfc_type: bool
      payload_hide: true
      example: true

    - &always_execute
      model_name: alwaysExecute
      tf_name: always_execute
      type: Bool
      description: >-
          When set to false (default), the chosen operations (recalculate or deploy, whichever is set to true) are executed only once and not executed on subsequent terraform apply runs. When set to true, the chosen operations are always executed, in every terraform apply run. This shows up as an "Update" to the resource which then always shows a change in the plan for this resource.
      ndfc_type: bool
      payload_hide: true
      example: false
      default_value: false

    - model_name: deploy
      tf_name: deploy
      type: Bool
      description: Perform deploy operation when true.
      default_value: false
      ndfc_type: bool
      payload_hide: true
      example: true
