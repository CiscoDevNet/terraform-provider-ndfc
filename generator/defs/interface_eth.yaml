---
resource: 
  name: interface_ethernet
  generate_tf_resource: true
  parent_package: resource_interface_common
  parent_model: interface_common
  modify_plan: true
  description: "This resource allows you to configure and manage ethernet interfaces on a switch"
  import_id:
    - "int_trunk_host:FDO245206N5[Ethernet1/1,Ethernet1/2],9990IQNFEZ6[Ethernet1/3,Ethernet1/2]"
    - "int_access_host:FDO245206N5"
  import_desc: 
    - "if_policy:serial_number[comma seperated list of interfaces]"
    - "if_policy:serial_number"
  attributes:
    - model_name: id
      tf_name: id
      type: String
      description: "Unique identifier for the interface"
      example: 1
      computed: true
      id: true
      use_state: true
    - &policy
      model_name: policy
      tf_name: policy
      type: String
      default_value: int_trunk_host
      tf_requires_replace: true
      description: |
          "Policy to be used for the interface. 
            Supported policies: 
            * `int_trunk_host`
            * `int_access_host`
            * `int_dot1q_tunnel_host`
            * `int_monitor_ethernet`
            * `int_pvlan_host`
            * `int_routed_host`
            * `int_shared_trunk_host`
            * `int_trunk_classic`
            * `epl_routed_intf`
            "
      example: int_access_host
    - model_name: policy_type
      tf_name: policy_type
      type: String
      default_value: "system"
      validator: OneOf("system", "user-defined")
      description: "Specifies if the policy is user defined or the default ones available in system"
      payload_hide: true
      example: system
    - model_name: deploy
      tf_name: deploy
      type: Bool
      default_value: false
      payload_hide: true
      description: "Deploy the configuration"
      example: true
      ndfc_type: bool
    - &serialNumber
      model_name: serial_number
      tf_name: serial_number
      type: String
      description: Serial number of switch to configure. This field cannot be specified if `serial_number` inside `interfaces` block is specified`
      example: 9DBYO6WQJ46
      payload_hide: true
      tf_requires_replace: true
      validator: ConflictsWith(path.Expressions {path.MatchRoot("interfaces").AtAnyMapKey().AtName("serial_number")}...)
    - &interfaces 
      model_name: interfaces
      tf_name: interfaces
      bulk: true
      filtered: true
      type: Map
      mandatory: true
      description: "interfaces to configure"
      parent_package: resource_interface_common
      parent_model: interfaces
      example: "Ethernet1/10"
      attributes:
      - model_name: filterThisValue
        tf_name: filter_this_value
        type: Bool
        tf_hide: true
        payload_hide: true
      - model_name: serialNumber
        tf_name: serial_number
        type: String
        description: Serial number of switch to configure. This field cannot be specified if `serial_number` is specified in the common block
      - &ifName
        model_name: ifName
        tf_name: interface_name
        type: String
        description: "Name of the Interface. Example: `Ethernet1/10`"
        example: Ethernet1/10
        mandatory: true
        requires_replace: true
      - &ifType
        model_name: interfaceType
        tf_name: interface_type
        tf_hide: true
        type: String
        description: "Type of interface. Examples: `ethernet`, `port-channel`"
        example: ethernet
        validator: OneOf("ethernet", "port-channel", "loopback", "vlan", "mgmt", "port-channel-sub")
      - <<: *ifName
        tf_hide: true
        payload_hide: false
        model_name: INTF_NAME
        ndfc_nested: [nvPairs]
      - model_name: CONF
        ndfc_nested: [nvPairs]
        tf_name: freeform_config
        type: String
        description: Additional CLI config (if any) for the interface configuration
        default_value: ""
        example: delay 200
      - model_name: ADMIN_STATE
        ndfc_nested: [nvPairs]
        tf_name: admin_state
        type: Bool
        default_value: true
        description: Enable or disable the interface
        example: false
      - model_name: DESC
        ndfc_nested: [nvPairs]
        tf_name: interface_description
        type: String
        description: Interface description
        example: My interface description
      - model_name: BPDUGUARD_ENABLED
        ndfc_nested: [nvPairs]
        tf_name: bpdu_guard
        type: String
        default_value: "true"
        validator: OneOf("true", "false", "no")
        enum_values: ["true", "false", "no"]
        description: "Enable spanning-tree bpduguard: true='enable', false='disable', no='return to default settings'"
        example: true
      - model_name: PORTTYPE_FAST_ENABLED
        ndfc_nested: [nvPairs]
        tf_name: port_type_fast
        type: Bool
        default_value: true
        description: Enable spanning-tree edge port behavior
        example: false
      - model_name: MTU
        ndfc_nested: [nvPairs]
        tf_name: mtu
        type: String
        enum_values: [default,jumbo, "576-9216"]
        default_value: jumbo
        description: MTU for the interface
        example: default
      - model_name: SPEED
        ndfc_nested: [nvPairs]
        tf_name: speed
        type: String
        validator: OneOf("Auto","10Mb","100Mb","1Gb","2.5Gb","5Gb","10Gb","25Gb","40Gb","50Gb","100Gb","200Gb","400Gb")
        enum_values: [Auto,10Mb,100Mb,1Gb,2.5Gb,5Gb,10Gb,25Gb,40Gb,50Gb,100Gb,200Gb,400Gb]
        default_value: Auto
        description: |
          "Interface speed. Should be one of the following:
            * `Auto`
            * `10Mb`
            * `100Mb`
            * `1Gb`
            * `2.5Gb`
            * `5Gb`
            * `10Gb`
            * `25Gb`
            * `40Gb`
            * `50Gb`
            * `100Gb`
            * `200Gb`
            * `400Gb`"
        example: Auto
      - model_name: ACCESS_VLAN
        ndfc_nested: [nvPairs]
        tf_name: access_vlan
        type: Int64
        ndfc_type: string
        min_int: 1
        max_int: 4094
        validator: Between(1, 4094)
        description: Access VLAN ID
        example: 500
        handle_empty: true
      - model_name: ENABLE_ORPHAN_PORT
        ndfc_nested: [nvPairs]
        tf_name: orphan_port
        type: Bool
        default_value: false
        description: If enabled, configure the interface as a vPC orphan port to be suspended by the secondary peer in vPC failures
        example: false
      - model_name: PTP
        ndfc_nested: [nvPairs]
        tf_name: ptp
        type: Bool
        default_value: false
        description: Enable PTP
        example: false
      - model_name: ENABLE_NETFLOW
        ndfc_nested: [nvPairs]
        tf_name: netflow
        type: Bool
        default_value: false
        description: Netflow is supported only if it is enabled on fabric
        example: false
      - model_name: NETFLOW_MONITOR
        ndfc_nested: [nvPairs]
        tf_name: netflow_monitor
        type: String
        description: Provide the Layer 2 Monitor Name
        default_value: ""
        example: MON1
        exclude_test: true
      - model_name: NETFLOW_SAMPLER
        ndfc_nested: [nvPairs]
        tf_name: netflow_sampler
        type: String
        description: Netflow sampler name, applicable to N7K only
        example: SAMPLER1
        exclude_test: true
        default_value: ""
      - model_name: ALLOWED_VLANS
        ndfc_nested: [nvPairs]
        tf_name: allowed_vlans
        type: String
        description: Allowed vlans for the ethernet interface. Allowed values are `none`, `all` or VLAN ranges (1-200,500-2000,3000)
        example: 10-20
        default_value: "none"
      - model_name: NATIVE_VLAN
        ndfc_nested: [nvPairs]
        tf_name: native_vlan
        type: Int64
        min_int: 1
        max_int: 4094
        ndfc_type: string
        description: Set native VLAN for the interface
        example: 1
        exclude_test: true
        handle_empty: true
        validator: Between(1, 4094)

      - model_name: INTF_VRF
        ndfc_nested: [nvPairs]
        tf_name: vrf
        type: String
        description: "Interface VRF name, default VRF if not specified"
        min_length: 1
        max_length: 32

      - model_name: IP
        ndfc_nested: [nvPairs]
        tf_name: ipv4_address
        type: String
        description: "IPv4 address of the interface"

      - model_name: PREFIX
        ndfc_nested: [nvPairs]
        tf_name: ipv4_prefix_length
        type: String
        description: "IP netmask length used with the IP address (Min:1, Max:31)"

      - model_name: ROUTING_TAG
        ndfc_nested: [nvPairs]
        tf_name: routing_tag
        type: String
        description: "Routing tag associated with interface IP"

      - model_name: DISABLE_IP_REDIRECTS
        ndfc_nested: [nvPairs]
        tf_name: disable_ip_redirects
        type: Bool
        default_value: false
        description: "Disable both IPv4/IPv6 redirects on the interface"

      - model_name: ENABLE_PIM_SPARSE
        ndfc_nested: [nvPairs]
        tf_name: enable_pim_sparse
        type: Bool
        default_value: false
        description: "Enable PIM sparse-mode on the interface"

      - model_name: PIM_DR_PRIORITY
        ndfc_nested: [nvPairs]
        tf_name: pim_dr_priority
        type: String
        default_value: 1
        description: "Configure priority for PIM DR election on the interface, default is 1"

      - model_name: ENABLE_PFC
        ndfc_nested: [nvPairs]
        tf_name: enable_pfc
        type: Bool
        default_value: false
        description: "Enable priority flow control"
        example: false

      - model_name: ENABLE_QOS
        ndfc_nested: [nvPairs]
        tf_name: enable_qos
        type: Bool
        default_value: false
        description: "Enable to configure a QoS Policy for this interface. If AI/ML Queuing is enabled on the fabric, will use the QOS_CLASSIFICATION policy. Enter a custom policy below to override"
        example: false

      - model_name: QOS_POLICY
        ndfc_nested: [nvPairs]
        tf_name: qos_policy
        type: String
        description: "Custom QoS Policy must be defined previously"

      - model_name: QUEUING_POLICY
        ndfc_nested: [nvPairs]
        tf_name: queuing_policy
        type: String
        description: "Queuing Policy must be defined previously"

      - model_name: LINK_STATE_ROUTING
        ndfc_nested: [nvPairs]
        tf_name: link_state_routing_protocol
        type: String
        computed: true
        optional: true
        enum_values: [ospf, is-is]
        description: "Link-State Routing Protocol: Select link-state routing protocol - Applicable as per template used"

      - model_name: LINK_STATE_ROUTING_TAG
        ndfc_nested: [nvPairs]
        tf_name: link_state_routing_tag
        type: String
        computed: true
        optional: true
        description: "Link-State Routing Tag: Link-state routing protocol tag - Usage as per template used"

      - model_name: IPv6
        ndfc_nested: [nvPairs]
        tf_name: ipv6_addr
        type: String
        description: "IPv6 Address: IPv6 address of the Interface"
        
      - model_name: IPv6_PREFIX
        ndfc_nested: [nvPairs]
        tf_name: ipv6_prefix_length
        type: String
        description: "IPv6 Prefix Length: Prefix length associated with IPv6 address (Min:64, Max:127)"

      - model_name: CDP_ENABLE
        ndfc_nested: [nvPairs]
        tf_name: cdp_enable
        type: Bool
        default_value: false
        description: "Enable CDP on the interface"
        example: false
      
      - model_name: PORT_DUPLEX_MODE
        ndfc_nested: [nvPairs]
        tf_name: port_duplex_mode
        type: String
        default_value: "auto"
        validator: OneOf("auto", "full", "half")
        enum_values: [auto, full, half]
        description: "Configure the port duplex mode"

      - model_name: ENABLE_MONITOR
        ndfc_nested: [nvPairs]
        tf_name: enable_monitor
        type: Bool
        default_value: false
        description: "Enable switchport monitor for SPAN / ERSPAN"
        example: false
      
      - model_name: PVLAN_MODE
        ndfc_nested: [nvPairs]
        tf_name: pvlan_mode
        type: String
        default_value: "host"
        validator: OneOf("promiscuous", "trunk promiscuous", "host", "trunk secondary")
        enum_values: [promiscuous, "trunk promiscuous", host, "trunk secondary"]
        description: "private-vlan mode"

      - model_name: PVLAN_ALLOWED_VLANS
        ndfc_nested: [nvPairs]
        tf_name: pvlan_allowed_vlans
        type: String
        optional: true
        description: "Allowed values: 'none', or vlan ranges (ex: 1-200,500-2000,3000)"

      - model_name: PVLAN_NATIVE_VLAN
        ndfc_nested: [nvPairs]
        tf_name: pvlan_native_vlan
        type: String
        optional: true
        description: "Native Vlan for private-vlan - valid values 1-4094"

      - model_name: IG_FOR_FEX
        ndfc_nested: [nvPairs]
        tf_name: ig_for_fex
        type: Bool
        description: "Shared group for fex ports"
      
      - model_name: AUTO_NEG
        ndfc_nested: [nvPairs]
        tf_name: auto_negotiate
        type: String
        default_value: "on"
        validator: OneOf("on", "off")
        enum_values: [on, off]
        description: "Auto Negotiate mode for speed"
    
      - model_name: PATH_COST
        ndfc_nested: [nvPairs]
        validator: Between(1, 200000000)
        tf_name: path_cost
        type: Int64
        ndfc_type: string
        description: "Spanning Tree Port Path Cost <1-200000000>"
      
      - model_name: GUARD_MODE
        ndfc_nested: [nvPairs]
        tf_name: guard_mode
        type: String
        validator: OneOf("root", "none", "loop", "no")
        enum_values: [root, none, loop, no]
        description: "Set spanning tree guard mode for the interface, select 'no' to delete the config"
      
      - model_name: TTAG
        ndfc_nested: [nvPairs]
        tf_name: ttag
        type: Bool
        description: "Enable Ttag/Ttag-strip"
      
      - model_name: MAPPING_LIST
        ndfc_nested: [nvPairs]
        tf_name: p_vlan_mapping_list
        type: List
        optional: true
        parent_package: resource_interface_common
        parent_model: p_vlan_mapping_list
        description: "Private VLAN promiscuous mapping"
        attributes:
          - model_name: S_VLAN
            tf_name: s_vlan
            type: String
            description: "SVlan Id"
          - model_name: P_VLAN
            tf_name: p_vlan
            type: String
            description: "P Vlan"
      
      - model_name: ASSOCIATION_LIST
        ndfc_nested: [nvPairs]
        tf_name: p_vlan_assoc_list
        type: List
        optional: true
        parent_package: resource_interface_common
        parent_model: p_vlan_assoc_list
        description: "Private VLAN host association"
        attributes:
          - model_name: S_VLAN
            tf_name: s_vlan
            type: String
            description: "SVlan Id"
          - model_name: P_VLAN
            tf_name: p_vlan
            type: String
            description: "P Vlan"
      
      - model_name: deployment_status
        tf_name: deployment_status
        type: String
        description: "Status of the deployment"
        example: "success"
        computed: true
        payload_hide: true
        use_state: true

      - model_name: customTemplateKV
        tf_name: custom_policy_parameters
        type: "Map:String"
        payload_hide: true
        description: Custom policy parameters
     